name: Node.js CI
on:
    push:
        branches: [groq, private]
    pull_request:

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        env:
            # onnxruntime-node (via @ricky0123/vad-node) downloads CUDA GPU extras on install
            # and its script breaks on Linux runners — VAD runs on the bundled CPU runtime, skip it
            ONNXRUNTIME_NODE_INSTALL: skip

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  cache: 'npm'
            - run: npm install
            - run: npm test
