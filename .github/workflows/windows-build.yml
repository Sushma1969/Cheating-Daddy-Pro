name: CI Desktop
on:
    pull_request:
        branches: [groq, private]
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                os: [windows-latest]

        runs-on: ${{ matrix.os }}

        env:
            # onnxruntime-node CUDA extras are not needed — the CPU runtime ships in the npm package
            ONNXRUNTIME_NODE_INSTALL: skip

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'
                  cache: 'npm'

            - name: Install JS dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Build Windows distributables (electron-forge)
              run: npm run make

            - name: Upload distributables
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build-${{ github.ref_name }}
                  path: out/make/**
                  if-no-files-found: error
